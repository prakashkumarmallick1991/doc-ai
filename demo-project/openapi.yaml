openapi: 3.0.3
info:
  title: Demo Users API
  version: 1.0.0
paths:
  /users:
    get:
      summary: List users
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, pending]
          description: Filter users by current status.
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    status:
                      type: string
